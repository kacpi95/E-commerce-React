<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-content">
        <div class="spinner"></div>

        <h1>Clothiq</h1>

        <p>Loading your shopping experience...</p>
      </div>
    </div>

    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #fff;
        z-index: 100;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .spinner {
        width: 56px;
        height: 56px;
        border: 4px solid #ececec;
        border-top: 4px solid #111;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loader-content h1 {
        margin: 0;
        font-family: Arial, sans-serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #111;
      }

      .loader-content p {
        margin: 0;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #666;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
